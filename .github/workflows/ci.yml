name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: no job here writes to the repo.
permissions:
  contents: read

# A newer push to the same ref makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # Python core: style, types, tests. uv is the only tool manager,
  # so every step goes through the same locked environment.
  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # --locked fails when pyproject and uv.lock disagree, which is
      # exactly the drift that bites later.
      - name: Install dependencies
        run: uv sync --locked

      # config/nan.yaml is git-ignored (it holds the API key); the
      # loader needs a file, so CI starts from the template.
      - name: Prepare local config
        run: cp config/nan.yaml.example config/nan.yaml

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync mypy

      - name: Tests
        run: uv run --no-sync pytest -q

      # Each service is its own uv project with its own tests.
      - name: Service tests
        run: |
          (cd workspace/services/system && uv run --frozen pytest -q)
          (cd workspace/services/network && uv run --frozen pytest -q)
          (cd workspace/services/mcp && uv run --frozen pytest -q)
          (cd builtin/services/record && uv run --frozen pytest -q)
          (cd builtin/services/vision && uv run --frozen pytest -q)

  # The distribution has to build: pyproject is the source of truth for
  # the wheel layout, and the console script ships with it.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

  # Desktop: the kernel and surfaces are plain React, so the checks are
  # the compiler, the tests, and a production build.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
