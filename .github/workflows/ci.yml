name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check backend builtin tests

      - name: Ruff format check
        run: uv run ruff format --check backend builtin tests

  lint-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Frontend tests
        run: npm run test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # `uv sync` installs the framework alone: the builtin plugins'
      # dependencies live in the `perception` extra, which CI does not
      # install. Their tests live in tests/builtin/ and are excluded
      # from the run below.
      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: |
          uv run pytest -q \
            --ignore=tests/builtin \
            --deselect "tests/test_paths_anchoring.py::test_builtin_modules_anchor_from_foreign_cwd"
