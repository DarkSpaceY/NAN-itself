# Pre-commit: fast local checks only. Type checking (mypy) and tests run in CI.
# Install: uv sync && uv run pre-commit install
# Run all: uv run pre-commit run --all-files
repos:
  # ---- Python ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(nan|builtin|tests)/
      - id: ruff-format
        files: ^(nan|builtin|tests)/
