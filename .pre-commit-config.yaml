# Pre-commit: the same checks CI runs, minus the packaging step.
# Install: uv sync && npm --prefix frontend ci && uv run pre-commit install
# Run all: uv run pre-commit run --all-files
#
# Every hook runs through uv, so the ruff/style version is the one in
# uv.lock -- the same binary CI uses. No separate hook environment, so
# the formatter cannot disagree with the one committed to the repo.
#
# Hooks are scoped by path: a Python-only commit never pays for the
# frontend build and vice versa.
repos:
  - repo: local
    hooks:
      # ---- Python ----
      # ruff's own extend-exclude (pyproject) decides the scope, so the
      # files checked here are exactly `ruff check .` in CI -- a new
      # top-level package cannot silently fall outside.
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        files: ^(nan|tests)/

      - id: pytest
        name: pytest
        entry: uv run --frozen pytest -q
        language: system
        pass_filenames: false
        files: ^(nan|builtin|tests)/

      # --frozen installs from the lock and never complains that
      # pyproject moved on; CI's `uv sync --locked` does. Catch it here.
      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      # ---- Services ----
      # Each service is its own uv project with its own lock. --directory
      # selects the project and makes its folder the cwd, which is what
      # `cd <service> && uv run --frozen pytest -q` does in CI.
      - id: pytest-system
        name: pytest (system service)
        entry: uv run --directory workspace/services/system --frozen pytest -q
        language: system
        pass_filenames: false
        files: ^workspace/services/system/

      - id: pytest-network
        name: pytest (network service)
        entry: uv run --directory workspace/services/network --frozen pytest -q
        language: system
        pass_filenames: false
        files: ^workspace/services/network/

      - id: pytest-mcp
        name: pytest (mcp service)
        entry: uv run --directory workspace/services/mcp --frozen pytest -q
        language: system
        pass_filenames: false
        files: ^workspace/services/mcp/

      - id: pytest-record
        name: pytest (record service)
        entry: uv run --directory builtin/services/record --frozen pytest -q
        language: system
        pass_filenames: false
        files: ^builtin/services/record/

      - id: pytest-service-kit
        name: pytest (service kit)
        entry: uv run --directory lib/nan-service-kit --frozen pytest -q
        language: system
        pass_filenames: false
        files: ^lib/nan-service-kit/

      # ---- Frontend ----
      # npm --prefix runs the script with frontend/ as its cwd, so the
      # hook does not need a shell to cd first.
      - id: tsc
        name: tsc
        entry: npm --prefix frontend run check
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$

      - id: vitest
        name: vitest
        entry: npm --prefix frontend run test
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$

      # CI runs the production build; a CSS import or vite config
      # mistake is invisible to tsc and vitest alone.
      - id: build
        name: build
        entry: npm --prefix frontend run build
        language: system
        pass_filenames: false
        files: ^frontend/
