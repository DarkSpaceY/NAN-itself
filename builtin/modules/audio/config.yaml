# Audio module (builtin/modules/audio/): mic owner + ambient
# perception + rolling PCM ring publisher.
#
# Path convention: relative paths resolve against the module
# folder (builtin/modules/audio/); absolute paths pass through
# unchanged.

device: null                # microphone index/name; null = system default

speaker_model: data/speaker/3dspeaker_speech_campplus_sv_zh-cn_16k-common.onnx

voices_registry: data/voices.json

tagger_model: data/audio_tag/model.int8.onnx

tagger_labels: data/audio_tag/class_labels_indices.csv

emotion_model: data/emotion/emotion2vec_plus_base.onnx

emotion_head: data/emotion/emotion2vec_head.json
