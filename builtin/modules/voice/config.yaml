# Voice module (builtin/modules/voice.py): full-duplex speech.
# Consumes the audio module's PCM ring; owns VAD endpointing, STT,
# the semantic/surface split (say task -> 0.6B SLM -> CosyVoice2)
# and barge-in.
#
# Path convention: relative paths resolve against the repository
# root; absolute paths pass through unchanged.

stt_model: base             # faster-whisper model size
stt_language: null          # e.g. zh; null = auto-detect

fast_path_enabled: true     # trivial turns answered without the main agent

tts_speed: 1.0              # CosyVoice speaking-rate multiplier

whisper_models_dir: models/whisper

slm_path: models/voice/slm/qwen3-0.6b

slm_repo_id: null           # HuggingFace repo for SLM auto-download; null = Qwen/Qwen3-0.6B

tts_checkout_dir: models/voice/cosyvoice

tts_model_dir: models/voice/tts/cosyvoice2-0.5b

tts_reference_wav: models/voice/tts/reference.wav

# Speaker diarization (pyannote embedding + local person-N registry).
# The pyannote models are gated: accept the terms at
# huggingface.co/pyannote/embedding, then paste a read token below.
# With weights already cached locally no token is needed.
diarization_repo: pyannote/embedding
diarization_token: ""        # HuggingFace read token
diarization_threshold: 0.75  # cosine above this = same person
diarization_models_dir: models/voice/diarization

voices_registry: data/databases/audio/voice_speakers.json
