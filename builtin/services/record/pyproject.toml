[project]
name = "nan-record-service"
version = "0.1.0"
description = "Turn archive service: persists completed turns and serves a trace UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
    "rocksdict>=0.3.25",
    "uvicorn>=0.30.0",
    "zstandard>=0.23.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.3.0", "httpx>=0.28.1"]
