<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAN · 原语系统 v1(β 骨架)</title>
<style>
  :root{
    --bg:#161514; --raise:#262420;
    --line:rgba(232,227,221,.08); --line-hi:rgba(232,227,221,.14);
    --ink:#e8e3dd; --dim:#8a8580; --faint:#5c5751;
    --accent:#d97757; --accent-2:#e8a860;
    --accent-soft:rgba(217,119,87,.10); --accent-line:rgba(217,119,87,.30);
    --ok:#8fbe6d; --err:#e5654f;
    --colw:920px;
    --sans:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;
    --mono:"Sarasa Mono SC","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;overflow:hidden}
  ::selection{background:rgba(217,119,87,.28)}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(232,227,221,.09);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

  /* ── Topbar:状态机 ───────────────── */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:42px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(22,21,20,.92);backdrop-filter:blur(12px)}
  .brand{font-weight:700;font-size:14px;letter-spacing:.04em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:none}
  body.working .dot{background:var(--accent);animation:breathe 1.1s ease-in-out infinite}
  .status{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .status .run{color:var(--accent)} .status .idle{color:var(--ok)}
  .sp{flex:1}
  .env{font-family:var(--mono);font-size:10.5px;color:var(--faint)}

  /* ── Stream ──────────────────────── */
  main{height:100%;overflow-y:auto}
  .col{max-width:var(--colw);margin:0 auto;padding:66px 30px 130px}
  .divider{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:center;margin:6px 0 26px;display:flex;align-items:center;gap:14px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  .row{margin-bottom:20px;animation:rise .24s ease-out both}
  @keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* ── 原语:Message ────────────────── */
  .user{display:flex;justify-content:flex-end}
  .bubble{max-width:76%;background:rgba(232,227,221,.075);border:1px solid var(--line);border-radius:16px 16px 5px 16px;padding:11px 16px;line-height:1.75}
  .meta{display:flex;gap:9px;align-items:center;margin-bottom:7px}
  .avatar{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#d97757,#e8a860)}
  .who{font-weight:600;font-size:14px}
  .prose{line-height:1.85;white-space:pre-wrap;max-width:66ch}
  .tsnote{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:6px}
  .caret{display:inline-block;width:8px;height:16px;border-radius:2px;background:var(--accent);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ── 原语:Record(核心)───────────── */
  .rec{font-family:var(--mono);font-size:12.5px;margin:0 -10px 4px;border-radius:8px;cursor:pointer}
  .rec:hover{background:rgba(232,227,221,.045)}
  .rrow{display:flex;gap:9px;align-items:baseline;padding:6px 10px}
  .glyph{width:16px;text-align:center;color:var(--faint);flex:none}
  .rec.running .glyph{color:var(--accent);animation:breathe 1.1s ease-in-out infinite}
  .rec.failed .glyph{color:var(--err)}
  .rec.done .glyph{color:var(--ok)}
  .rname{color:var(--ink)}
  .rsum{color:var(--dim)}
  .rsum b{color:var(--ok);font-weight:500}
  .note{font-size:10.5px;color:var(--faint);margin-left:auto;flex:none}
  .chev{color:var(--faint);font-size:9px;flex:none;transition:transform .2s;width:10px;text-align:center}
  .rec.open .chev{transform:rotate(90deg)}
  .rdetail{display:none;font-size:12px;color:var(--faint);line-height:1.9;padding:2px 10px 8px 35px}
  .rdetail .f{color:var(--dim)} .rdetail b{color:var(--ok);font-weight:500}
  .rdetail .e{color:var(--err)}
  .rec.open .rdetail{display:block}

  /* ── 原语:Note 跟随宿主(见 .note/.t)── */

  /* ── 原语:Pulse ──────────────────── */
  @keyframes breathe{0%,100%{opacity:1;transform:scaleY(1)}50%{opacity:.45;transform:scaleY(.85)}}

  /* ── Composer ────────────────────── */
  .composer{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:rgba(22,21,20,.92);backdrop-filter:blur(12px);padding:13px 20px 15px}
  .cp-in{max-width:var(--colw);margin:0 auto;display:flex;align-items:center;gap:11px}
  .cp-in .ps{color:var(--accent);font-family:var(--mono);font-size:14px}
  .cp-in input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:15px;font-family:var(--sans);caret-color:var(--accent)}
  .cp-in input::placeholder{color:var(--faint)}
  .cp-in kbd{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:2px 7px}
  .cp-status{font-family:var(--mono);font-size:10.5px;color:var(--faint);white-space:nowrap}
</style>
</head>
<body>

  <div class="topbar">
    <span class="brand">NAN</span>
    <span class="dot"></span>
    <span class="status" id="status"><span class="idle">● 空闲</span> · sleep 15s</span>
    <span class="sp"></span>
    <span class="env">local-model · 127.0.0.1:11434 · ctx 12.4k</span>
  </div>

  <main>
    <div class="col" id="stream">
      <div class="divider">今天 · 8月27日</div>
    </div>
  </main>

  <div class="composer">
    <div class="cp-in">
      <span class="ps">❯</span>
      <input placeholder="输入消息…" autocomplete="off">
      <kbd>⏎</kbd>
      <span class="cp-status" id="cp-status">seq 42</span>
    </div>
  </div>

<script>
  const stream = document.getElementById('stream');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const scroll = () => { document.querySelector('main').scrollTop = 1e9; };
  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const GLYPHS = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'];

  /* Record 工厂:统一机器原语 */
  function makeRecord({glyph, name, sum, note}) {
    const el = document.createElement('div');
    el.className = 'rec running';
    el.innerHTML = `<div class="rrow"><span class="glyph">${glyph}</span><span class="rname">${name}</span><span class="rsum">${sum||''}</span><span class="note">${note||''}</span><span class="chev">▸</span></div><div class="rdetail"></div>`;
    el.querySelector('.rrow').onclick = () => el.classList.toggle('open');
    stream.appendChild(el); scroll();
    return {
      el,
      detail: el.querySelector('.rdetail'),
      glyphEl: el.querySelector('.glyph'),
      sumEl: el.querySelector('.rsum'),
      noteEl: el.querySelector('.note'),
      spinner: null,
      startSpin(){ let i=0; this.spinner=setInterval(()=>{ this.glyphEl.textContent=GLYPHS[i++%GLYPHS.length]; },110); },
      stopSpin(g){ clearInterval(this.spinner); this.glyphEl.textContent=g; },
      addDetail(html){ const d=document.createElement('div'); d.innerHTML=html; this.detail.appendChild(d); scroll(); },
      done(summary, note){ this.stopSpin('✓'); this.el.classList.remove('running'); this.el.classList.add('done');
        if(summary!==undefined && this.sumEl) this.sumEl.innerHTML=summary; if(note && this.noteEl) this.noteEl.textContent=note;
        this.el.classList.remove('open'); },
      fail(){ this.stopSpin('✗'); this.el.classList.remove('running'); this.el.classList.add('failed'); this.el.classList.add('open'); },
    };
  }

  function addUser(text){
    const row=document.createElement('div'); row.className='row user';
    row.innerHTML=`<div class="bubble"></div>`; stream.appendChild(row); scroll();
    return type(row.querySelector('.bubble'), text);
  }
  function addNano(text, ts){
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`<div class="prose"></div><div class="tsnote"></div>`;
    stream.appendChild(row); scroll();
    return type(row.querySelector('.prose'), text).then(()=>{
      row.querySelector('.tsnote').textContent = '\u2713 ' + ts + ' \u00b7 0.9s \u00b7 turn #042';
      scroll();
    });
  }

  async function type(el, text){
    for(let i=0;i<text.length;){
      el.innerHTML = esc(text.slice(0, i+=2)) + '<span class="caret"></span>';
      scroll(); await sleep(24);
    }
    el.textContent = text;
  }

  function setStatus(html){ document.getElementById('status').innerHTML = html; }

  let running = false;
  async function replay(){
    if(running) return; running = true;
    [...stream.querySelectorAll('.row,.rec,.divider:not(:first-child)')].forEach(n=>n.remove());
    setStatus('<span class="run">● 工作中</span> · 工具 2 · 子代理 1');
    await sleep(400);

    // 1. 用户
    await addUser('帮我看看最近 workspace 改了哪些文件,顺便确认我的时区偏好还在记忆里。');
    await sleep(300);

    // 2. Record:工具调用(运行 → 详节流入 → 完成 → 自动折叠)
    const scan = makeRecord({glyph:'▸', name:'workspace.scan()'});
    scan.startSpin(); await sleep(450);
    scan.addDetail('<b>103 files</b> · changed <b>3</b> · deleted 0');
    for(const f of ['src/nan_itself/app.py','workspace/persona.md','docs/memory-design.md']){
      scan.addDetail(`· <span class="f">${f}</span>`); await sleep(220);
    }
    await sleep(350);
    scan.done('<b>103 files</b> · <b>+3</b> changed', '0.4s');
    await sleep(400);

    // 3. Record:子代理派发(简报=详节;运行中)
    const disp = makeRecord({glyph:'◈', name:'dispatch_subagent', sum:'memory-review'});
    disp.startSpin(); await sleep(300);
    disp.addDetail('简报 · 核对记忆中「UTC+8」「极简回答」两条的有效性,无冲突即闭合。');
    disp.el.classList.add('open');

    // 4. Record:读文件失败 → 重试(错误保持展开,重试后消化)
    const read = makeRecord({glyph:'▸', name:'files.read', sum:'docs/memory-design.md'});
    read.startSpin(); await sleep(1200);
    read.addDetail('<span class="e">✗ 超时 90s · 本地模型未响应</span>');
    read.fail(); await sleep(700);

    const retry = makeRecord({glyph:'▸', name:'files.read', sum:'重试'});
    retry.startSpin(); await sleep(800);
    retry.addDetail('ok · 9.8k chars · 设计文档 v1,待评审状态');
    retry.done('9.8k chars', '1.2s'); await sleep(400);

    // 5. Record:子代理报告到达 → 派发记录闭合
    await sleep(500);
    const rep = makeRecord({glyph:'◈', name:'report', sum:'memory-review', note:''});
    rep.el.classList.remove('running'); rep.el.classList.add('done');
    rep.glyphEl.textContent='✓';
    rep.addDetail('m-000001 / m-000002 均有效,无冲突,未新增。');
    rep.el.classList.add('open'); scroll(); await sleep(900);
    rep.done('已消化', '1m12s');
    disp.done('报告已消化', ''); await sleep(400);

    // 6. NAN 最终回复(回合以文本结束)
    await addNano('最近改动 3 个文件:app.py、persona.md、memory-design.md;其中设计文档读了一次超时,重试成功。\n记忆确认:时区 UTC+8、偏好极简回答,两条均有效,未新增。', '22:41:40');

    // 7. 循环继续:sleep 也是过程
    const sl = makeRecord({glyph:'\u25b8', name:'sleep', sum:'15s'});
    sl.startSpin(); await sleep(700);
    sl.done('\u4e0b\u4e00\u8df3 22:42:13', '');

    setStatus('<span class="idle">● 空闲</span> · sleep 15s');
    document.getElementById('cp-status').textContent = 'seq 43 · 下一跳 22:42:13';
    running = false;
  }

  replay();
</script>
</body>
</html>
