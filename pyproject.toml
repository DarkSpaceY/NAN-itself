[project]
name = "nan-itself"
version = "0.1.0"
description = "A self-contained, local-first agent core: one loop per agent, handles for multi-agent, external services for injection"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "DarkSpaceY", email = "yif.chien.nolimit@gmail.com" }
]
keywords = ["agent", "llm", "local-first", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "openai>=3.2.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.2",
    "uvicorn>=0.30.0",
    "websockets>=13", # uvicorn needs a ws implementation to serve /ws at all
]

[project.urls]
Homepage = "https://github.com/DarkSpaceY/NAN-itself"
Repository = "https://github.com/DarkSpaceY/NAN-itself"
Issues = "https://github.com/DarkSpaceY/NAN-itself/issues"

[dependency-groups]
dev = [
    "httpx>=0.28.1", # gateway-guard tests hit the real HTTP server
    "mypy>=1.18.0",
    "pre-commit>=4.0.0",
    "psutil>=7.0.0", # service-probe tests import workspace/services/*/main.py
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
]

[tool.ruff]
line-length = 100
# First-party code only; vendored/experimental/legacy trees are excluded.
extend-exclude = [
    "models",
    "paper_search",
    "workspace",
    "builtin",
    "data",
    "frontend",
    "legacy",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # long lines: let the formatter handle them, don't fail CI on them
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[project.scripts]
nan = "nan.app:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is nan-itself; the importable package is nan/
# at the repository root.
module-name = "nan"
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["nan"]
exclude = ["^tests/", "^models/", "^paper_search/", "^legacy/"]

# Global looseness for the existing codebase; tighten incrementally.
check_untyped_defs = true
warn_unused_ignores = false
warn_return_any = false
disallow_untyped_defs = false
ignore_missing_imports = true
