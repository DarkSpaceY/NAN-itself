[project]
name = "nan-itself"
version = "0.1.0"
description = "A self-contained, local-first agent framework with hot-reloadable tools, skills and perception modules"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "DarkSpaceY", email = "yif.chien.nolimit@gmail.com" }
]
keywords = ["agent", "llm", "mcp", "hot-reload", "local-first", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "fastapi>=0.141.1",
    "fastmcp>=2.14.1",
    "loguru>=0.7.3",
    "mcp<3",
    "num2words>=0.5.14",
    "openai>=3.2.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.2",
    "soar-sml>=9.6.5",
    "uvicorn>=0.30.0",
]

# The dependencies of the builtin plugins -- the modules and tools that
# ship under builtin/ and are loaded like any other hot-reloadable
# source. They are a separate feature set, not a prerequisite of the
# framework: `uv sync` installs the framework alone, and the audio,
# voice, vision, network and system modules come up loudly failed until
# you opt in.
#
#     uv sync --all-extras     # framework + builtin plugins
#
# CI installs the framework only; its tests for the builtin content live
# in tests/builtin/ and are excluded there.
[project.optional-dependencies]
desktop = [
    "pywebview>=5.4",
]
perception = [
    "easyocr>=1.7.2",
    "face-recognition>=1.3.0",
    "face-recognition-models>=0.3.0",
    "faster-whisper>=1.2.1",
    "huggingface-hub>=0.30.0",
    "httpx>=0.28.1",
    "mss>=10.2.0",
    "numpy>=1.26.0",
    "onnxruntime>=1.20.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=12.3.0",
    "psutil>=7.0.0",
    "pyannote.audio>=3.3.2",
    "pywhispercpp>=1.5.0",
    # Pinned below 81: face_recognition_models still uses
    # pkg_resources (removed from setuptools 81+).
    "setuptools>=80.9.0,<81",
    "sherpa-onnx>=1.13.6",
    "sounddevice>=0.5.6",
    "soundfile>=0.13.1",
    "transformers>=4.49.0",
    "webrtcvad-wheels>=2.0.14",
]

[project.urls]
Homepage = "https://github.com/DarkSpaceY/NAN-itself"
Repository = "https://github.com/DarkSpaceY/NAN-itself"
Issues = "https://github.com/DarkSpaceY/NAN-itself/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
nan-itself = "nan_itself:main"
nan-desktop = "nan_itself.desktop:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
