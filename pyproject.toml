[project]
name = "nan-itself"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DarkSpaceY", email = "yif.chien.nolimit@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.122.0",
    "easyocr>=1.7.2",
    "face-recognition>=1.3.0",
    "face-recognition-models>=0.3.0",
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "fastmcp>=2.14.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "mcp<3",
    "mss>=10.2.0",
    "openai>=3.2.0",
    "pillow>=12.3.0",
    "psutil>=7.0.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "pywhispercpp>=1.5.0",
    "realtimestt>=1.0.2",
    "setuptools>=84.0.0",
    "sherpa-onnx>=1.13.6",
    "soar-sml>=9.6.5",
    "sounddevice>=0.5.6",
    "transformers>=4.49.0",
    "webrtcvad>=2.0.10",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
nan-itself = "nan_itself:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
