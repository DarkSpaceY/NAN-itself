mcp_servers:

  files:
    command: npx
    args:
      - "--yes"
      - "@modelcontextprotocol/server-filesystem@2026.7.10"
      - "./workspace"

  playwright:
    command: npx
    args:
      - "--yes"
      - "@playwright/mcp@0.0.79"
      - "--headless"

  command:
    command: uvx
    args:
      - "mcp-shell-server==1.1.4"

  calculation:
    command: npx
    args:
      - "--yes"
      - "@cyanheads/calculator-mcp-server@0.4.0"

  prolog:
    command: npx
    args:
      - "--yes"
      - "@vpursuit/swipl-mcp-server@2.0.6"