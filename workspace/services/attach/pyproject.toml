[project]
name = "nan-attach-service"
version = "0.1.0"
description = "Stateless reader service: one file (text or image) plus one request in, one answer out"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.27.0",
    "loguru>=0.7.3",
    "nan-service-kit",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
nan-service-kit = { path = "../../../lib/nan-service-kit", editable = true }

[dependency-groups]
dev = ["pytest>=8.3.0"]
