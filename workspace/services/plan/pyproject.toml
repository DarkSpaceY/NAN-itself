[project]
name = "nan-plan-service"
version = "0.1.0"
description = "Goal-tree injection service: outcomes, not steps"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "loguru>=0.7.3",
    "nan-service-kit",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
nan-service-kit = { path = "../../../lib/nan-service-kit", editable = true }

[dependency-groups]
dev = ["pytest>=8.3.0"]
